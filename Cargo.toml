[workspace]
resolver = "2"
members = [
    "crates/lak-core",
    "crates/lak-proto",
    "crates/lak-tal",
    "crates/lak-services",
    "crates/lak-are",
    "crates/lakd",
]

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"

# 工具库
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
bitflags = "2"
glob = "0.3"
dashmap = "6"
parking_lot = "0.12"

# HTTP / gRPC
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"
http = "1"

# 测试
tokio-test = "0.4"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# kernel errors are rich enums; boxing them would hurt ergonomics
result-large-err = "allow"
# docs for every Result/panic path are disproportionate for an MVP;
# doc_markdown is extremely noisy against Chinese prose containing
# identifier names
missing-errors-doc = "allow"
missing-panics-doc = "allow"
must-use-candidate = "allow"
module-name-repetitions = "allow"
doc-markdown = "allow"
# numeric conversions between token counts and u64/usize are benign here
cast-precision-loss = "allow"
cast-possible-truncation = "allow"
cast-sign-loss = "allow"
cast-possible-wrap = "allow"
cast-lossless = "allow"
too-many-lines = "allow"
similar-names = "allow"
struct-excessive-bools = "allow"
fn-params-excessive-bools = "allow"
# stylistic preferences that do not affect correctness
map-unwrap-or = "allow"
match-same-arms = "allow"
wildcard-imports = "allow"
redundant-closure-for-method-calls = "allow"
return-self-not-must-use = "allow"
needless-pass-by-value = "allow"
format-push-string = "allow"
unused-self = "allow"
duration-suboptimal-units = "allow"
default-trait-access = "allow"
items-after-statements = "allow"
single-match = "allow"
single-match-else = "allow"
match-wildcard-for-single-variants = "allow"
ref-option = "allow"
manual-range-contains = "allow"
len-zero = "allow"
manual-string-new = "allow"
uninlined-format-args = "allow"
assigning-clones = "allow"
unnecessary-literal-bound = "allow"
no-effect-underscore-binding = "allow"
option-if-let-else = "allow"
missing-const-for-fn = "allow"
